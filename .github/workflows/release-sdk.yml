name: Release SDK

# Tag: sdk-v* — publishes @<owner>/checkout to GitHub Packages / npm
# generates SHA-256 checksums, and creates a GitHub Release with verified assets.

on:
  push:
    tags:
      - "sdk-v*"

jobs:
  release-sdk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    defaults:
      run:
        working-directory: pkg/checkout
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Forge build (generates out/ for the ABI manifest)
        working-directory: .
        run: forge build

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@${{ github.repository_owner }}"

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#sdk-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Sync package scope with repository owner
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("./package.json", "utf8"));
            pkg.name = "@${{ github.repository_owner }}/checkout";
            pkg.version = "${{ steps.version.outputs.version }}";
            fs.writeFileSync("./package.json", JSON.stringify(pkg, null, 2));
            console.log("Package name aligned to:", pkg.name, "v" + pkg.version);
          '

      - name: Install SDK dependencies
        run: bun install

      - name: Regenerate ABI manifest & Build SDK
        run: bun run build

      - name: Test SDK
        run: bun test

      - name: Package SDK Tarball & Generate SHA-256 Checksums
        id: checksums
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TARBALL=$(npm pack)
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          
          # Generate SHA-256 checksums file
          sha256sum "$TARBALL" src/abis.json src/abis.jsonl > CHECKSUMS-SHA256.txt
          cat CHECKSUMS-SHA256.txt
          
          # Read tarball hash for release notes
          TARBALL_SHA=$(sha256sum "$TARBALL" | awk '{print $1}')
          echo "tarball_sha=$TARBALL_SHA" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Packages
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PKG_NAME="@${{ github.repository_owner }}/checkout"
          if npm view "${PKG_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "::notice::${PKG_NAME}@${VERSION} is already published — skipping (idempotent release)"
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release with Checksums & Assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          TARBALL="${{ steps.checksums.outputs.tarball }}"
          TARBALL_SHA="${{ steps.checksums.outputs.tarball_sha }}"

          gh release create "$TAG" \
            "$TARBALL" \
            "CHECKSUMS-SHA256.txt" \
            "src/abis.json" \
            "src/abis.jsonl" \
            --title "economic-zone-sdk v${VERSION}" \
            --notes "## Install

          Published to GitHub Packages:

          \`\`\`bash
          bun add @${{ github.repository_owner }}/checkout@${VERSION}
          # or
          npm install @${{ github.repository_owner }}/checkout@${VERSION}
          \`\`\`

          ---

          ## 🔒 Cryptographic Checksums (SHA-256)

          | Artifact | SHA-256 Hash |
          | :--- | :--- |
          | \`$TARBALL\` | \`$TARBALL_SHA\` |

          \`\`\`bash
          # Verify integrity
          sha256sum -c CHECKSUMS-SHA256.txt
          \`\`\`

          ---

          ## 🚀 Quick Usage

          \`\`\`ts
          import { ZoneCheckoutClient, ZoneClient } from \"@${{ github.repository_owner }}/checkout\";

          // 1. Prepare 1-Click Checkout with Instant 1% Cashback
          const client = new ZoneCheckoutClient(\"0xSwapPayRouterAddress...\");
          const payload = client.prepare1ClickPayment(
            1n,             // projectId
            100_000000n,    // 100 USDC in
            50_000000000000000000n, // 50 HNY required
            50n             // 0.5% max slippage
          );

          // 2. Decode on-chain packed bytes32 version
          const info = ZoneClient.decodeProtocolVersion(rawVersionTag);
          console.log(info.contractName, info.major, info.minor, info.patch);
          \`\`\`"
