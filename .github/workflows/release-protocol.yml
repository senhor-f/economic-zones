name: Release Protocol

# Tag: v* (excluding sdk-v*) — builds core protocol, generates SHA-256 checksums,
# and publishes contract artifacts to GitHub Releases.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  release-protocol:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build Contracts
        run: forge build --sizes

      - name: Run Test Suite
        run: forge test -vvv

      - name: Package Core Artifacts & Generate Checksums
        id: artifacts
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          
          # Create clean artifact tarball of compilation outputs
          tar -czf "economic-zone-core-${TAG}.tar.gz" out/ script/ src/
          
          # Generate SHA-256 checksums
          sha256sum "economic-zone-core-${TAG}.tar.gz" .gas-snapshot > CHECKSUMS-CORE-SHA256.txt
          cat CHECKSUMS-CORE-SHA256.txt
          
          TARBALL_SHA=$(sha256sum "economic-zone-core-${TAG}.tar.gz" | awk '{print $1}')
          echo "tarball_sha=$TARBALL_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.artifacts.outputs.tag }}"
          TARBALL_SHA="${{ steps.artifacts.outputs.tarball_sha }}"

          gh release create "$TAG" \
            "economic-zone-core-${TAG}.tar.gz" \
            "CHECKSUMS-CORE-SHA256.txt" \
            ".gas-snapshot" \
            --title "Economic Zones Protocol ${TAG}" \
            --notes "## Economic Zones Protocol Release ${TAG}

          ### 🔒 Cryptographic Checksums (SHA-256)

          | Artifact | SHA-256 Hash |
          | :--- | :--- |
          | \`economic-zone-core-${TAG}.tar.gz\` | \`$TARBALL_SHA\` |

          \`\`\`bash
          # Verify integrity
          sha256sum -c CHECKSUMS-CORE-SHA256.txt
          \`\`\`

          ---

          ### 🏛️ Included Modules:
          - **Ethereum L1**: Augmented Bonding Curve ($HNY), Treasury Yield Vaults (ERC-4626), Floor Dripper, xHNY Lockbox (xERC20), EIP-4844 KZG Blob Verifier (0x0A).
          - **Base L2**: 1-Click Drop-in Checkout (+1% Instant Cashback), Continuous Payroll Streaming, Revenue Splits with Auto-Stake, veHNY Savings Lockers.
          - **Testing**: 60/60 passing Foundry suites (32k invariant fuzzing, 100% bank runs, live Base fork)."
